services:
  - type: web
    name: sudheer-portfolio
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sudheer-portfolio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MFA_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: sudheer-portfolio-db
    databaseName: portfolio
    user: portfolio_user
